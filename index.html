<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio // Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="logo">RADIO //</a>
    </div>
    <div class="header-right">
      <button class="header-btn" id="favorites-toggle">
        <span class="heart-icon">&#9829;</span>
        <span class="favorites-count">0</span>
      </button>
      <button class="header-btn" id="filters-toggle" data-open-filters>Filters</button>
      <span class="kbd-hint"><kbd>&#8984;</kbd><kbd>K</kbd></span>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- Left: Station Grid (40%) -->
    <section class="panel panel--grid" id="grid-panel">
      <div class="grid-header">
        <h2 class="grid-title" id="grid-title">All Stations</h2>
        <span class="grid-count" id="grid-count">0 stations</span>
      </div>
      <div class="grid-controls">
        <div class="control-row">
          <div class="inline-search">
            <svg class="inline-search__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input type="search" id="inline-search" placeholder="Search stations, countries, tags..."
                   autocomplete="off" aria-label="Search stations" />
          </div>
          <select id="country-select" class="country-select" aria-label="Country">
            <option value="">All countries</option>
          </select>
        </div>
        <div class="chip-row" id="continent-chips" role="group" aria-label="Continent"></div>
        <div class="chip-row" id="tag-chips" role="group" aria-label="Tags"></div>
      </div>
      <div class="station-grid" id="station-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p>No stations match your filters.</p>
        <button class="btn-clear" id="clear-filters">Clear filters</button>
      </div>
    </section>

    <!-- Right: Map / Globe (60%) -->
    <section class="panel panel--map" id="map-panel">
      <div class="view-switch" id="view-switch" role="group" aria-label="Visualization">
        <button class="view-card view-card--active" data-view="map" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z" />
            <path d="M9 4v13M15 7v13" />
          </svg>
          <span>Map</span>
        </button>
        <button class="view-card" data-view="globe" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.5 2.4 3.8 5.5 3.8 9S14.5 18.6 12 21c-2.5-2.4-3.8-5.5-3.8-9S9.5 5.4 12 3Z" />
          </svg>
          <span>Globe</span>
        </button>
        <button class="view-card" data-view="globegl" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M4.2 8.5c2.6 1.9 5.4 2.4 8.1 1.4 2.4-.9 4.8-.4 7 1.4M6 18.4c1.4-2.2 1.3-4.3-.3-6.2" />
          </svg>
          <span>3D</span>
        </button>
      </div>
      <div id="map"></div>
      <div id="globe" hidden></div>
      <div id="globegl" hidden></div>
    </section>
  </main>

  <!-- Player Bar -->
  <footer class="player-bar" id="player-bar">
    <div class="player-info">
      <div class="player-station" id="player-station">Select a station</div>
      <div class="player-meta" id="player-meta"></div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="btn-prev">&#9198;</button>
      <button class="player-btn player-btn--large" id="btn-play">&#9654;</button>
      <button class="player-btn" id="btn-next">&#9197;</button>
    </div>
    <div class="player-extras">
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.8" />
      <button class="player-btn" id="btn-favorite">&#9829;</button>
      <button class="player-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-icon-moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          <g class="theme-icon-sun">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
          </g>
        </svg>
      </button>
      <div class="sleep-dropdown">
        <button class="player-btn" id="btn-sleep">&#128164;</button>
        <div class="sleep-menu" id="sleep-menu">
          <button data-min="15">15 min</button>
          <button data-min="30">30 min</button>
          <button data-min="60">60 min</button>
          <button data-min="90">90 min</button>
          <button data-min="0">Off</button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Search Modal -->
  <div class="search-modal" id="search-modal" style="display:none;">
    <div class="search-backdrop"></div>
    <div class="search-container">
      <input type="text" class="search-input" id="search-input" placeholder="Search stations, countries, tags..." />
      <div class="search-results" id="search-results"></div>
      <div class="search-footer">
        <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> Navigate</span>
        <span><kbd>&#8629;</kbd> Play</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <!-- Filter Sidebar -->
  <aside class="filter-sidebar" id="filter-sidebar">
    <div class="filter-header">
      <h3>Filters</h3>
      <button class="close-btn" id="close-filters">&#10005;</button>
    </div>
    <div class="filter-body" id="filter-body">
      <div class="filter-section">
        <h4>Country</h4>
        <div class="filter-list" id="filter-countries"></div>
      </div>
      <div class="filter-section">
        <h4>Tags</h4>
        <div class="filter-list" id="filter-tags"></div>
      </div>
      <div class="filter-section">
        <h4>Bitrate</h4>
        <div class="filter-list" id="filter-bitrates"></div>
      </div>
    </div>
  </aside>

  <!-- Single audio element.
       No crossorigin attribute: it would force a CORS check on every
       stream, and radio servers do not send Access-Control-Allow-Origin.
       Only add it back if the audio data itself needs to be read. -->
  <audio id="audio-player"></audio>
</body>
</html>
