server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Dokploy terminates TLS at Traefik and forwards over plain HTTP, so
  # the real client protocol only survives in this header.
  real_ip_header X-Forwarded-For;

  # The API sends no compression of its own, but our bundle is ours to
  # compress: ~200 KB of JS drops to ~60 KB.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Vite fingerprints these filenames, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /favicon.svg {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # index.html must never be cached, or a deploy leaves clients pinned to
  # asset names that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
